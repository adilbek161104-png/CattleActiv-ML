<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IoT Command Center | CattleActiv-ML 2.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- PWA Setup -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#198754">
    <link rel="apple-touch-icon" href="/static/img/app_icon_192.png">
</head>
<body class="dark-theme">
    <div class="navbar">
        <div class="logo"><i class="fas fa-satellite-dish"></i> CattleActiv-ML</div>
        <div class="nav-links">
            <a href="/"><i class="fas fa-plus-circle"></i> <span data-i18n="nav_add">Yangi Mol Qo'shish</span></a>
            <a href="/sensor_input" class="active"><i class="fas fa-desktop"></i> <span data-i18n="nav_sensor">Sensor Input</span></a>
            <a href="/dashboard"><i class="fas fa-chart-line"></i> <span data-i18n="nav_analytics">Analytics & AI Chat</span></a>
            <a href="/cows"><i class="fas fa-paw"></i> <span data-i18n="nav_base">Qoramollar Bazasi</span></a>
            
            <a href="/ai_diagnosis"><i class="fas fa-stethoscope"></i> <span data-i18n="nav_ai_diag">AI Diagnostika</span></a>
            <select id="langSwitch" class="modern-select">
                <option value="uz">O'zbek</option>
                <option value="ru">Русский</option>
                <option value="en">English</option>
                <option value="qq">Qaraqalpaq</option>
            </select>
            <a href="/settings"><i class="fas fa-cog"></i> <span data-i18n="nav_settings">Sozlamalar</span></a>
            <a href="/logout" style="background: #ef4444;"><i class="fas fa-sign-out-alt"></i> <span data-i18n="nav_logout">Chiqish</span></a>

            <a href="/about"><i class="fas fa-info-circle"></i> <span data-i18n="nav_about">Sayt Haqida</span></a>
        </div>
    </div>

    <div class="container">

        <div class="card iot-panel">
            <div class="panel-header">
                <h2><span data-i18n="sensor_title">Live Sensor Data Input</span></h2>
                <div class="status-indicator">
                    <span class="dot pulse"></span> <span data-i18n="sensor_online">System Online</span>
                </div>
            </div>
            
            <form id="activityForm" class="iot-form">
                <div class="form-grid">
                    <div class="form-group">
                        <label><i class="fas fa-tag"></i> <span data-i18n="sensor_cow_id">Cow ID:</span></label>
                        <input type="number" id="cow_id" name="cow_id" placeholder="Qoramol raqamini kiriting" required min="1">
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-shoe-prints"></i> <span data-i18n="sensor_steps">Qadamlar (kunlik):</span></label>
                        <input type="number" id="steps" name="steps" placeholder="Masalan: 3500" required min="0">
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-running"></i> <span data-i18n="sensor_movement">Yurish vaqti (soat):</span></label>
                        <input type="number" id="movement" name="movement" placeholder="Masalan: 5.5" step="0.1" required min="0" max="24">
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-tooth"></i> <span data-i18n="sensor_rumination">Chaynash (Rumination) daqiqa:</span></label>
                        <input type="number" id="rumination" name="rumination" placeholder="Masalan: 450" required min="0" max="1440">
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-thermometer-half"></i> <span data-i18n="sensor_temp">Tana harorati (°C):</span></label>
                        <input type="number" id="temperature" name="temperature" placeholder="Masalan: 38.5" step="0.1" required min="30" max="45">
                    </div>
                </div>

                <button type="submit" class="btn primary-btn"><i class="fas fa-microchip"></i> <span data-i18n="sensor_start_ai">Start AI Diagnosis</span></button>
            </form>

            <div id="result-container" class="result-container hidden">
                <h3><i class="fas fa-poll"></i> Diagnosis Results</h3>
                <div class="result-grid">
                    <div class="result-card ai-result">
                        <span class="result-label">Deep Learning (Random Forest) Output:</span>
                        <div id="ml-result" class="result-value"></div>
                    </div>
                    <div class="result-card rule-result">
                        <span class="result-label">Rule-Based Veterinary Logic:</span>
                        <div id="rule-result" class="result-value"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
    
    <!-- Language Support -->
    <script src="{{ url_for('static', filename='js/translations.js') }}"></script>
    <script src="{{ url_for('static', filename='js/lang.js') }}"></script>
    
    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js');
        });
      }
    </script>
</body>
</html>
