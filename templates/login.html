<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tizimga Kirish | CattleActiv-ML</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: rgba(9, 22, 16, 0.8); backdrop-filter: blur(24px); border: 1px solid var(--border); padding: 40px 30px; border-radius: var(--radius-lg); box-shadow: var(--shadow); width: 90%; max-width: 400px; text-align: center; }
        h2 { color: var(--primary-color); margin-bottom: 20px; font-size: 2rem; }
        .error { color: #ef4444; margin-bottom: 15px; font-weight: bold; }
    </style>
</head>
<body class="dark-theme">
    <div class="login-box">
        <h2 data-i18n="login_title">CattleActiv-ML</h2>
        <p style="color: var(--text-muted); margin-bottom: 20px;" data-i18n="login_desc">Tizimga kirish uchun malumotlarni kiriting</p>
        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}
        <form method="POST" style="text-align: left;">
            <div style="margin-bottom: 15px;">
                <label style="color: var(--text-muted);" data-i18n="login_user">Login:</label>
                <input type="text" name="username" placeholder="Loginni kiriting" required style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--input-bg); color: white; margin-top: 5px; font-size: 16px;">
            </div>
            <div style="margin-bottom: 20px;">
                <label style="color: var(--text-muted);" data-i18n="login_pass">Parol:</label>
                <input type="password" name="password" placeholder="Parolni kiriting" required style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--input-bg); color: white; margin-top: 5px; font-size: 16px;">
            </div>
            <button type="submit" class="btn primary-btn" style="width: 100%;"><span data-i18n="login_btn">Kirish</span></button>
        </form>
        <p style="color: #666; font-size: 14px; margin-top: 20px;">Birlamchi login: <b>admin</b> | parol: <b>admin123</b></p>
    </div>

    <!-- Language script -->
    <script src="{{ url_for('static', filename='js/translations.js') }}"></script>
    <script src="{{ url_for('static', filename='js/lang.js') }}"></script>
</body>
</html>
