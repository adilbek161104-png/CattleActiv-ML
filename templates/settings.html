<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sozlamalar</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background-color: #f4f7f6; margin: 0; }
        .settings-box { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 90%; max-width: 400px; margin: 50px auto; text-align: center; box-sizing: border-box; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; }
        button:hover { background: #0056b3; }
        .error { color: red; margin-bottom: 10px; font-weight: bold; }
        .success { color: green; margin-bottom: 10px; font-weight: bold; }
        .back-link { display: inline-block; margin-top: 20px; color: #555; text-decoration: none; font-size: 16px; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="settings-box">
        <h2>Parolni O'zgartirish</h2>
        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}
        {% if success %}
            <div class="success">{{ success }}</div>
        {% endif %}
        <form method="POST">
            <input type="password" name="old_password" placeholder="Eski parolni kiriting" required>
            <input type="password" name="new_password" placeholder="Yangi parol yarating" required>
            <button type="submit">Saqlash</button>
        </form>
        <a href="/" class="back-link">← Bosh sahifaga qaytish</a>
    </div>
</body>
</html>
