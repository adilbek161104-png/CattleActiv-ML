<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sozlamalar | CattleActiv-ML</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body { padding: 20px; margin: 0; }
        .settings-box { background: rgba(9, 22, 16, 0.8); backdrop-filter: blur(24px); border: 1px solid var(--border); padding: 40px 30px; border-radius: var(--radius-lg); box-shadow: var(--shadow); width: 90%; max-width: 400px; margin: 50px auto; text-align: center; }
        h2 { color: var(--primary-color); margin-bottom: 20px; font-size: 1.8rem; }
        .error { color: #ef4444; margin-bottom: 15px; font-weight: bold; }
        .success { color: #10b981; margin-bottom: 15px; font-weight: bold; }
        .back-link { display: inline-block; margin-top: 20px; color: var(--text-muted); text-decoration: none; font-size: 16px; }
        .back-link:hover { color: white; }
    </style>
</head>
<body class="dark-theme">
    <div class="settings-box">
        <h2>Sozlamalar</h2>
        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}
        {% if success %}
            <div class="success">{{ success }}</div>
        {% endif %}
        <form method="POST" style="text-align: left;">
            <h3 style="color: white; margin-bottom: 15px; font-size: 1.2rem;">Parolni O'zgartirish</h3>
            <div style="margin-bottom: 15px;">
                <label style="color: var(--text-muted);">Eski parol:</label>
                <input type="password" name="old_password" placeholder="Eski parolni kiriting" required style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--input-bg); color: white; margin-top: 5px; font-size: 16px;">
            </div>
            <div style="margin-bottom: 20px;">
                <label style="color: var(--text-muted);">Yangi parol:</label>
                <input type="password" name="new_password" placeholder="Yangi parol yarating" required style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--input-bg); color: white; margin-top: 5px; font-size: 16px;">
            </div>
            <button type="submit" class="btn primary-btn" style="width: 100%;">Saqlash</button>
        </form>

        <hr style="border: none; border-top: 1px solid var(--border); margin: 30px 0;">

        <div style="text-align: left;">
            <h3 style="color: white; margin-bottom: 15px; font-size: 1.2rem;">Tilni Tanlash</h3>
            <select id="langSwitch" class="modern-select" style="width: 100%; padding: 12px;">
                <option value="uz">O'zbek</option>
                <option value="ru">Русский</option>
                <option value="en">English</option>
                <option value="qq">Qaraqalpaq</option>
            </select>
        </div>

        <a href="/" class="back-link">← Bosh sahifaga qaytish</a>
    </div>

    <!-- Language script works here too -->
    <script src="{{ url_for('static', filename='js/translations.js') }}"></script>
    <script src="{{ url_for('static', filename='js/lang.js') }}"></script>
</body>
</html>
